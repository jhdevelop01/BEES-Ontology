apiVersion: 1

datasources:
  - name: InfluxDB-BEES
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: samsung-gec
      defaultBucket: raw_7d
    secureJsonData:
      token: bees-dev-token
    isDefault: true
    editable: true
